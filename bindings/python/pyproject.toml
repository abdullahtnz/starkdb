[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starkdb"
version = "1.1.0"
description = "Python bindings for STARKDB - a lightweight embedded key-value database with ML array support"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Abdullah Novruzlu", email = "novruzluabdullah03@gmail.com"}
]
keywords = ["database", "embedded", "key-value", "ml", "numpy", "zero-copy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"

[project.optional-dependencies]
numpy = ["numpy>=1.20"]
pandas = ["pandas>=1.3", "numpy>=1.20"]
all = ["numpy>=1.20", "pandas>=1.3"]

[tool.setuptools.packages.find]
include = ["starkdb", "starkdb.*"]
